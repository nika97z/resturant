<footer class="footer">
  <div class="footer-grid">

    <div class="col">
      <a routerLink="/" class="logo">Foodie</a>
      <p class="tagline">Delicious food delivered to your door</p>
      <div class="socials">
        <a href="#" class="social-icon" aria-label="Facebook">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
        </a>
        <a href="#" class="social-icon" aria-label="Instagram">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
        </a>
        <a href="#" class="social-icon" aria-label="Twitter">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"/></svg>
        </a>
      </div>
    </div>

    <div class="col">
      <h4>Contact</h4>
      <p>123 Food Street</p>
      <p>City, State 12345</p>
      <p>Phone: (555) 123-4567</p>
      <p>Mon-Sun: 10AM - 10PM</p>
    </div>

    <div class="col">
      <h4>Quick Links</h4>
      <a routerLink="/menu">Menu</a>
      <a routerLink="/">About</a>
      <a routerLink="/">Contact</a>
      <a routerLink="/">Terms of Service</a>
      <a routerLink="/">Privacy Policy</a>
    </div>

    <div class="col">
      <h4>Newsletter</h4>
      <p class="newsletter-sub">Subscribe to get special offers</p>
      <div class="subscribe-row">
        <input type="email" placeholder="Your email" [ngModel]="email()" (ngModelChange)="email.set($event)">
        <button type="button" (click)="subscribe()">Subscribe</button>
      </div>
    </div>

  </div>
</footer>
